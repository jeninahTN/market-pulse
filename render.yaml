services:
  - type: web
    name: market-pulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./market_pulse.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: MARKET_PULSE_JSON_LOGS
        value: "1"
      - key: MARKET_PULSE_ENABLE_MOCK_AUTH
        value: "0"
      - key: MARKET_PULSE_PREFER_LOCALHOST
        value: "0"
