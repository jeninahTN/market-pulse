{% extends "base.html" %}

{% block content %}
<div class="container login-wrapper" style="max-width: 480px; margin-top: 60px;">
    <div style="text-align: center; margin-bottom: 40px;">
        <div
            style="display: inline-flex; align-items: center; gap: 10px; font-size: 1.8rem; font-weight: 800; color: var(--text-dark); margin-bottom: 10px;">
            <i class="fas fa-key text-warning"></i> Market Pulse
        </div>
        <p style="color: var(--text-muted);">Reset your password</p>
    </div>
    
    <div class="auth-card"
        style="background: var(--bg-white); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); width: 100%; max-width: 450px; border: 1px solid var(--border-color); color: var(--text-dark);">
        
        {% if token_valid %}
        <!-- Reset Password Form -->
        <form id="reset-form" onsubmit="handleResetPassword(event)">
            <input type="hidden" id="reset-token" value="{{ token }}">
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;">
                    New Password
                </label>
                <div style="position: relative;">
                    <input type="password" id="new-password" placeholder="Enter new password" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; padding-right: 40px;"
                        oninput="updatePasswordStrength(this.value)">
                    <button type="button" onclick="togglePasswordVisibility('new-password')" 
                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer;">
                        <i class="fas fa-eye" id="new-password-eye"></i>
                    </button>
                </div>
                
                <!-- Password Strength Indicator -->
                <div style="margin-top: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Password Strength</span>
                        <span id="strength-text" style="font-size: 0.75rem; font-weight: 600;">-</span>
                    </div>
                    <div style="height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; border-radius: 2px;"></div>
                    </div>
                    <div id="password-feedback" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;"></div>
                </div>
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;">
                    Confirm Password
                </label>
                <div style="position: relative;">
                    <input type="password" id="confirm-password" placeholder="Confirm new password" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; padding-right: 40px;"
                        oninput="checkPasswordMatch()">
                    <button type="button" onclick="togglePasswordVisibility('confirm-password')" 
                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer;">
                        <i class="fas fa-eye" id="confirm-password-eye"></i>
                    </button>
                </div>
                <div id="match-feedback" style="font-size: 0.75rem; margin-top: 4px;"></div>
            </div>
            
            <button type="submit" id="btn-reset" class="btn-primary"
                style="width: 100%; justify-content: center; padding: 12px; margin-bottom: 20px;">
                <span id="btn-text">Reset Password</span>
                <div id="btn-loading" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i> Resetting...
                </div>
            </button>
        </form>
        
        {% else %}
        <!-- Invalid Token Message -->
        <div style="text-align: center; padding: 40px 0;">
            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 3rem; margin-bottom: 20px;"></i>
            <h3 style="color: var(--text-dark); margin-bottom: 15px;">Invalid or Expired Link</h3>
            <p style="color: var(--text-muted); margin-bottom: 30px;">
                This password reset link is invalid or has expired. Please request a new one.
            </p>
            <a href="/login" class="btn-primary" style="display: inline-block; padding: 12px 24px; text-decoration: none;">
                Back to Login
            </a>
        </div>
        {% endif %}
    </div>
</div>

<script>
// Password strength calculation
function updatePasswordStrength(password) {
    const feedback = document.getElementById('password-feedback');
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');
    
    let score = 0;
    let feedbacks = [];
    
    // Length
    if (password.length >= 8) {
        score += 20;
    } else {
        feedbacks.push("Add at least 8 characters");
    }
    
    // Uppercase
    if (/[A-Z]/.test(password)) {
        score += 20;
    } else {
        feedbacks.push("Add uppercase letter");
    }
    
    // Lowercase
    if (/[a-z]/.test(password)) {
        score += 20;
    } else {
        feedbacks.push("Add lowercase letter");
    }
    
    // Number
    if (/\d/.test(password)) {
        score += 20;
    } else {
        feedbacks.push("Add number");
    }
    
    // Special character
    if (/[!@#$%^&*()_+\-=\[\]{};:"\\|,.<>\/?]/.test(password)) {
        score += 20;
    } else {
        feedbacks.push("Add special character");
    }
    
    // Update UI
    strengthBar.style.width = score + '%';
    
    if (score >= 80) {
        strengthBar.style.backgroundColor = '#28a745';
        strengthText.textContent = 'Very Strong';
        strengthText.style.color = '#28a745';
    } else if (score >= 60) {
        strengthBar.style.backgroundColor = '#17a2b8';
        strengthText.textContent = 'Strong';
        strengthText.style.color = '#17a2b8';
    } else if (score >= 40) {
        strengthBar.style.backgroundColor = '#ffc107';
        strengthText.textContent = 'Medium';
        strengthText.style.color = '#ffc107';
    } else {
        strengthBar.style.backgroundColor = '#dc3545';
        strengthText.textContent = 'Weak';
        strengthText.style.color = '#dc3545';
    }
    
    feedback.innerHTML = feedbacks.length > 0 ? feedbacks.join(' • ') : 'Great password!';
}

function checkPasswordMatch() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const matchFeedback = document.getElementById('match-feedback');
    
    if (confirmPassword === '') {
        matchFeedback.innerHTML = '';
        return;
    }
    
    if (newPassword === confirmPassword) {
        matchFeedback.innerHTML = '<span style="color: #28a745;">✓ Passwords match</span>';
    } else {
        matchFeedback.innerHTML = '<span style="color: #dc3545;">✗ Passwords do not match</span>';
    }
}

function togglePasswordVisibility(fieldId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(fieldId + '-eye');
    
    if (field.type === 'password') {
        field.type = 'text';
        eye.className = 'fas fa-eye-slash';
    } else {
        field.type = 'password';
        eye.className = 'fas fa-eye';
    }
}

function handleResetPassword(event) {
    event.preventDefault();
    
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const token = document.getElementById('reset-token').value;
    
    if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
    }
    
    if (newPassword.length < 8) {
        showMessage('Password must be at least 8 characters', 'error');
        return;
    }
    
    // Show loading
    document.getElementById('btn-text').style.display = 'none';
    document.getElementById('btn-loading').style.display = 'block';
    document.getElementById('btn-reset').disabled = true;
    
    // Submit reset request
    fetch('/auth/reset-password-confirm', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
            token: token,
            password: newPassword
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showMessage('Password reset successfully! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            showMessage(data.message || 'Reset failed', 'error');
        }
    })
    .catch(error => {
        showMessage('Network error. Please try again.', 'error');
    })
    .finally(() => {
        // Hide loading
        document.getElementById('btn-text').style.display = 'block';
        document.getElementById('btn-loading').style.display = 'none';
        document.getElementById('btn-reset').disabled = false;
    });
}

function showMessage(message, type) {
    // Create a toast notification instead of alert
    const toast = document.createElement('div');
    toast.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 20px;
        border-radius: 8px;
        color: white;
        font-weight: 500;
        z-index: 1000;
        max-width: 300px;
        ${type === 'success' ? 'background: #28a745;' : 'background: #dc3545;'}
    `;
    toast.textContent = message;
    
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
    }, 3000);
}
</script>
{% endblock %}
